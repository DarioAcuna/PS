<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cúpula App - Inicio de Sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="contenedor-login">
  <h1>Inicio de sesión</h1>

  <div id="errorContainer" style="display: none;" class="error-container"></div>

  <form id="formularioLogin" class="login-form">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Contraseña" required>

    <button type="submit" id="submitBtn" class="primary-btn">Iniciar sesión</button>
  </form>

  <a href="#" class="link-recuperar secondary-link">¿Has olvidado tu contraseña?</a>

  <button type="button" (click)="irASignup()" class="btn-signup">
    ¿No tienes cuenta? Crear una
  </button>
</div>

</body>
</html>
