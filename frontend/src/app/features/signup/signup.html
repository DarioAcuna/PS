<div class="pantalla-completa">
  <div class="contenedor-registro">
    <h1>Crear cuenta</h1>

    <!-- Mostrar mensaje de error si existe -->
    @if (mensajeError) {
      <div class="mensaje-error">{{ mensajeError }}</div>
    }

    <form (ngSubmit)="registrar()">

      <input type="text" name="nombre" [(ngModel)]="nombreUsuario" placeholder="Nombre" required [disabled]="cargando">
      <input type="text" name="apellidos" [(ngModel)]="apellidosUsuario" placeholder="Apellidos" required [disabled]="cargando">
      <input type="email" name="email" [(ngModel)]="emailUsuario" placeholder="Email" required [disabled]="cargando">
      <input type="password" name="password" [(ngModel)]="passwordUsuario" placeholder="Contraseña" required [disabled]="cargando">

      <button type="submit" [disabled]="cargando">
        @if (cargando) {
          Creando cuenta...
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <a href="/login" class="link-login">¿Ya tienes cuenta? Inicia sesión</a>
  </div>
</div>
