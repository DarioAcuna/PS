<header class="dashboard-header">
  <nav class="header-nav">
    <button
      *ngFor="let item of navItems"
      type="button"
      class="nav-link"
      [class.active]="selectedTab === item.id"
      (click)="onSelectTab(item.id)"
    >
      {{ item.label }}
    </button>
  </nav>

  <div class="header-actions">
    <ng-container *ngIf="canPreviewAsUser">
      <span class="preview-label" *ngIf="isPreviewingAsUser">
        Como lo veria el usuario
      </span>

      <button
        *ngIf="!isPreviewingAsUser"
        type="button"
        class="header-btn"
        (click)="showUserPreview()"
      >
        Vista usuario
      </button>

      <button
        *ngIf="isPreviewingAsUser"
        type="button"
        class="header-btn"
        (click)="showAdminPreview()"
      >
        Volver vista admin
      </button>
    </ng-container>

    <button type="button" class="header-btn" (click)="onGoHome()">
      Vista Inicio
    </button>

    <button type="button" class="header-btn" (click)="onLogout()">
      Cerrar Sesión
    </button>
  </div>
</header>
